# Render Blueprint — deploy from repo root
services:
  - type: web
    name: routism-social-api
    runtime: node
    plan: free
    # IMPORTANT: leave root at repo root (do NOT set rootDir to "server")
    buildCommand: npm install && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
